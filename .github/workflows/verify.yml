name: Harness verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Required harness checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PUPPETEER_CACHE_DIR: ${{ runner.temp }}/harness-chromium
      # GitHub's isolated runner may disable user namespaces for Chromium.
      HARNESS_DOCGEN_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - name: Install pinned test dependencies
        run: |
          python3 -m pip install -r tests/requirements.txt
          npm install --global npm@11.6.2 --no-audit --no-fund
          npm ci --prefix tests/fixtures/fe-components --no-audit --no-fund
          npm ci --prefix common/skills/doc-gen/assets --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y postgresql-16 libnss3 libatk-bridge2.0-0 libx11-xcb1 libgbm1 libasound2t64 fonts-noto-cjk
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.9.3
          go -C tests/fixtures/grpcurl mod download
      - name: Verify all required contracts and fixtures
        run: bash scripts/verify.sh
